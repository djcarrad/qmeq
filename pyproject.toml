[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "cython",
    "numpy",
    "scipy"
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qmeq"]

[tool.setuptools.package-data]
qmeq = ["*.pyx", "*.pxd", "*.c"]

[project]
name = "qmeq"
version = "1.2.0"
description = "Package for transport calculations in quantum dots using approximate quantum master equations"
authors = [{ name="Gediminas Kirsanskas", email="qmeq.package@gmail.com" }]
license = { text = "BSD 2-Clause" }

classifiers = ['Development Status :: 5 - Production/Stable',
               'Intended Audience :: Science/Research',
               'License :: OSI Approved :: BSD License',
               'Operating System :: MacOS',
               'Operating System :: Microsoft :: Windows',
               'Operating System :: POSIX',
               'Operating System :: Unix',
               'Programming Language :: Cython',
               'Programming Language :: Python :: 3',
               'Topic :: Scientific/Engineering :: Physics']

dependencies = [
    "numpy",
    "scipy",
    "cython"
]

[project.urls]
Homepage = 'http://github.com/gedaskir/qmeq'

[project.readme]
file="README.md"
content-type = "text/markdown"